version: '3.8'

services:
  gh-personal:
    image: diegonorman/gh-personal:latest
    networks:
      - net
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_NOCODB_URL=https://base.archcloud.com.br/api/v2
      - NOCODB_API_TOKEN=NGqq6w8rSbkwc5COh_XB3lnOfKOgzi2xt7TpdPni
      - JWT_SECRET=7f8a9b2c4d6e1f3a5b7c9d0e2f4a6b8c1d3e5f7a9b0c2d4e6f8a1b3c5d7e9f0a2b4c6d8e0f2a4b6c8d0e1f3a5b7c9d
    volumes:
      - gh-personal-videos:/app/public/videos
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

networks:
  net:
    external: true
    name: net

volumes:
  gh-personal-videos:
    driver: local
